<!DOCTYPE html>
<html>
<head>
    <title>Book Management</title>
</head>
<body>
    <h1>Book Management System</h1>

    <h2>Add New Book</h2>

    <form method="POST">
        {% csrf_token %}
        Title:
        <input type="text" name="title" required><br><br>

        Author:
        <input type="text" name="author" required><br><br>

        Price:
        <input type="number" name="price" min="0" required><br><br>

        <button type="submit">Add Book</button>
    </form>

    <hr>

    <h2>All Books</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>
                <a href="{% url 'update_price' book.id %}">
                    Update Price
                </a>

                <a href="{% url 'delete_book' book.id %}">
                    Delete
                </a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No books available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
